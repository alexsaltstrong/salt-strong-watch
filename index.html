<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152c52">
  <meta name="description" content="Browse and watch Salt Strong inshore fishing videos. Find lessons by species, structure, conditions, technique and tackle.">
  <title>Salt Strong WATCH | Find your next fishing lesson</title>
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
  <link rel="stylesheet" href="styles.css?v=next-1">
</head>
<body>
  <header class="site-header">
    <div class="header-inner shell">
      <a class="brand" href="./" aria-label="Salt Strong WATCH home"><img src="assets/salt-strong-logo.png" alt="Salt Strong"><strong>WATCH</strong></a>
      <nav class="top-nav" aria-label="WATCH sections">
        <button type="button" class="nav active" data-view="home">Discover</button>
        <button type="button" class="nav" data-view="browse">All Videos</button>
        <button type="button" class="nav" data-view="saved">Saved <span id="saved-count"></span></button>
        <button type="button" class="nav" data-view="courses">Courses</button>
      </nav>
      <label class="search" for="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search oyster bars, redfish, tides..." autocomplete="off"><span class="visually-hidden">Search videos</span></label>
    </div>
  </header>
  <div class="status-strip"><div class="shell"><span>Learn more. Search less. Catch more.</span><span id="data-status" aria-live="polite">Loading lessons...</span></div></div>
  <div id="app"></div>
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal" id="modal" tabindex="-1">
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="app.js?v=next-1" defer></script>
</body>
</html>
