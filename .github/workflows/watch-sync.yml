name: Refresh and publish WATCH
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'populate_catalog.py'
      - 'sync_catalog.py'
      - 'catalog.sample.json'
      - 'index.html'
      - 'app.js'
      - 'brand.css'
      - '.github/workflows/watch-sync.yml'
  schedule:
    - cron: '15 10 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  populate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video importer
        run: |
          python -m pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Test shortcode extraction and catalog generation
        run: python -m unittest -q test_longform_extractor test_populate_catalog
      - name: Read the ten public articles
        run: python populate_catalog.py --seed catalog.sample.json --output catalog.json --audit import-audit.json
      - name: Upload import audit (even when incomplete)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-import-audit
          path: import-audit.json
          if-no-files-found: warn
      - name: Commit verified catalog for next run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          if git diff --cached --quiet; then
            echo 'Catalog unchanged'
          else
            git commit -m 'Refresh WATCH video catalog'
            git push
          fi
      - name: Build static site payload
        run: |
          mkdir -p _site
          cp index.html app.js brand.css seed.js salt-strong-logo.png thumbnail-fallback.svg catalog.sample.json catalog.json _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
