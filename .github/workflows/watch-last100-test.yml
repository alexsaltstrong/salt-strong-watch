name: WATCH experiment - last 100 YouTube articles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  last-100-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WATCH repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing importer and browser dependencies
        run: |
          python -m pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Run unit tests
        run: python -m unittest -v test_watch_last100
      - name: Discover last 100 public Articles and import YouTube videos
        run: |
          python watch_last100.py --limit 100 --output last100-catalog.json --audit last100-audit.json --summary last100-summary.md
      - name: Display results in job summary
        if: always()
        run: |
          if [ -f last100-summary.md ]; then
            cat last100-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary generated; inspect the preceding step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Downloadable test catalog and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-last100-experiment
          path: |
            last100-catalog.json
            last100-audit.json
            last100-summary.md
          if-no-files-found: warn
